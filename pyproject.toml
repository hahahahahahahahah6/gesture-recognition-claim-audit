[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-recognition-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for hand signals from camera input"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
gesture-recognition-claim-audit = "gesture_recognition_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["gesture_recognition_claim_audit*"]
